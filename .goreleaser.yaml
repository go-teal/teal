version: 2

project_name: teal

before:
  hooks:
    - go mod tidy

builds:
  - id: teal
    main: ./cmd/teal
    binary: teal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/go-teal/teal/pkg/configs.TEAL_VERSION={{ .Tag }}

archives:
  - id: teal
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Security"
      regexp: '^.*?sec(urity)?(\(.+\))??!?:.+$'
      order: 2
    - title: "Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 3
    - title: "Dependency updates"
      regexp: '^.*?(chore|build)\(deps\).+$'
      order: 4
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^ci:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: go-teal
    name: teal
  draft: false
  prerelease: auto
  header: |
    ## teal {{ .Tag }}

    CLI and library release. Install the CLI with:

    ```bash
    go install github.com/go-teal/teal/cmd/teal@{{ .Tag }}
    ```

    Or download a prebuilt binary from the assets below.
  footer: |
    **Full changelog**: https://github.com/go-teal/teal/compare/{{ .PreviousTag }}...{{ .Tag }}
